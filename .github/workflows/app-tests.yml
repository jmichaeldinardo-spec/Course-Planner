name: Course Planner app tests
on:
  push:
    branches: [pilot/app-foundation]
  pull_request:
    paths: [app/**]
permissions:
  contents: read
jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run app tests
        run: cd app && node --test tests/*.test.mjs
      - name: Run hosted-harness safety checks (no hosted access)
        run: cd app && node --test tests/hosted/safety.test.mjs tests/hosted/runtime.test.mjs
